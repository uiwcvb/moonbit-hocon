name: MoonBit quality checks
on: [push, pull_request]

permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.11.0'
      - name: Install MoonBit
        run: |
          export MOON_HOME="$RUNNER_TEMP/hocon-moonbit"
          echo "MOON_HOME=$MOON_HOME" >> "$GITHUB_ENV"
          installer="$RUNNER_TEMP/hocon-moonbit-install.sh"
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o "$installer"
          echo "46495f8cdc0050f79b6cb195d66478d101cb3601d68506568fbe377fcdf2a9fe  $installer" | sha256sum -c -
          SHELL=/bin/false bash "$installer" "$(cat .moonbit-version)"
          echo "$MOON_HOME/bin" >> "$GITHUB_PATH"
      - name: Record source and tool versions
        run: |
          mkdir -p evidence
          {
            git rev-parse HEAD
            cat .moonbit-version
            moon version --all
            node --version
            uname -a
          } | tee evidence/ci-toolchain.txt
      - run: moon update
      - run: moon fmt && moon info && git diff --exit-code
      - run: moon check --deny-warn
      - name: Check cold MoonBit transition consumer
        run: node tools/test-transition-consumer.mjs
        env:
          HOCON_CONSUMER_CACHE: ${{ runner.temp }}/hocon-transition-consumer
      - run: node tools/generate-double-render-tests.mjs --check
      - run: node tools/generate-small-integer-tests.mjs --check
      - run: node tools/generate-double-parse-tests.mjs --check
      - run: moon test --target wasm-gc --deny-warn
      - run: moon test --target js --deny-warn
      - run: moon build --target js --deny-warn
      - name: Refresh actual browser engine
        run: |
          engine=_build/js/debug/build/cmd/web/web.js
          test -s "$engine"
          cp "$engine" web/engine.mjs
          sha256sum web/engine.mjs | tee evidence/ci-engine.sha256
      - run: node tools/generate-double-getter-tests.mjs --check --bridge
      - run: node tools/test-demo.mjs
      - name: Install isolated browser regression dependencies
        run: npm ci --prefix tools/browser --ignore-scripts --no-audit --no-fund
        env:
          npm_config_cache: ${{ runner.temp }}/hocon-npm-cache
      - name: Install Chromium
        run: node tools/browser/node_modules/playwright/cli.js install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/hocon-playwright
      - name: Check public demo in Chromium
        run: npm test --prefix tools/browser
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/hocon-playwright
      - run: node tools/test-cli.mjs
      - run: node tools/test-host.mjs
      - run: node tools/test-properties-host.mjs
      - run: node tools/test-file-syntax-host.mjs
      - run: node tools/test-transition-host.mjs
      - run: node tools/test-transition-policy-errors.mjs
      - run: node tools/test-preview-binding.mjs
      - run: node tools/test-preview-script.mjs
      - run: node tools/test-service-config-check.mjs
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Record Java version
        run: java -version 2>&1 | tee evidence/ci-java.txt
      - name: Fetch pinned independent Config reference
        run: |
          curl -fsSL https://repo.maven.apache.org/maven2/com/typesafe/config/1.4.9/config-1.4.9.jar -o /tmp/hocon-config-1.4.9.jar
          echo "47d13e3196c84f2a8ccd014ae563738c3da5b7406b38e03505ec0601a2f4fc37  /tmp/hocon-config-1.4.9.jar" | sha256sum -c -
      - run: node tools/test-openwhisk.mjs
        env:
          HOCON_REFERENCE_JAR: /tmp/hocon-config-1.4.9.jar
      - run: node examples/read-openwhisk.mjs
      - run: node tools/test-change-review.mjs
        env:
          HOCON_REFERENCE_JAR: /tmp/hocon-config-1.4.9.jar
      - run: node tools/test-config-reference.mjs --golden
      - run: node tools/test-file-reference.mjs --golden
      - run: node tools/test-collections.mjs --golden
      - run: node tools/test-collection-host.mjs
      - run: node tools/test-http-reference.mjs --golden
      - run: node tools/test-http-host.mjs
      - run: node tools/test-tree-reference.mjs --golden
      - run: node tools/test-tree-host.mjs
      - run: node tools/test-document-reference.mjs --golden
      - run: node tools/test-document-host.mjs
      - run: node tools/test-accessor-reference.mjs --golden
      - run: node tools/test-accessor-host.mjs
      - run: node tools/test-temporal-reference.mjs --golden
      - run: node tools/test-temporal-host.mjs
      - run: node tools/test-persistent-reference.mjs --golden
      - run: node tools/test-persistent-async.mjs
      - run: node tools/test-persistent-host.mjs
      - run: node tools/test-persistent-memory.mjs
      - run: node tools/test-path-reference.mjs --golden
      - run: node tools/test-native-read-reference.mjs --golden
      - run: node tools/test-native-read-host.mjs
      - run: node tools/test-value-reference.mjs --golden
      - run: node tools/test-value-async.mjs
      - run: node tools/test-value-host.mjs
      - run: node tools/test-value-walk-reference.mjs --golden
      - run: node tools/test-value-walk-host.mjs
      - run: node tools/test-render-reference.mjs --golden
      - run: node tools/test-render-async.mjs
      - run: node tools/test-render-host.mjs
      - run: node tools/test-entry-reference.mjs --golden
      - run: node tools/test-entry-async.mjs
      - run: node tools/test-entry-host.mjs
      - run: node tools/test-entry-memory.mjs
      - run: node tools/robustness.mjs
      - run: node tools/benchmark.mjs
      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-evidence
          path: |
            evidence/
            output/playwright/
            output/transition-consumer/
